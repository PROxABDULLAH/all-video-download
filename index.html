<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PROxABDULLAH · NEO DOWNLOADER</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy-dark: #020412;
      --navy-light: #0a0e29;
      --neon-red: #ff003c;
      --neon-red-dim: rgba(255, 0, 60, 0.2);
      --neon-red-glow: rgba(255, 0, 60, 0.6);
      --text-main: #e0e4ff;
      --success-color: #00ffaa;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Share Tech Mono', monospace;
      font-weight: bold;
      background-color: var(--navy-dark);
      background-image: 
        radial-gradient(circle at center, var(--navy-light) 0%, transparent 70%),
        linear-gradient(var(--neon-red-dim) 1px, transparent 1px),
        linear-gradient(90deg, var(--neon-red-dim) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      background-position: center, 0 0, 0 0;
      animation: cyberGrid 3s linear infinite;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 15px;
    }

    @keyframes cyberGrid {
      0% { background-position: center, 0 0, 0 0; }
      100% { background-position: center, 40px 40px, 40px 40px; }
    }

    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 10vh;
      background: linear-gradient(to bottom, transparent, var(--neon-red-dim), transparent);
      opacity: 0.5;
      transform: translateY(-10vh);
      animation: scanline 6s linear infinite;
      pointer-events: none;
      z-index: 999;
      will-change: transform;
    }

    @keyframes scanline {
      0% { transform: translateY(-10vh); }
      100% { transform: translateY(110vh); }
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: rgba(2, 4, 18, 0.9);
      border: 2px solid var(--neon-red);
      border-radius: 8px;
      padding: 35px;
      position: relative;
      backdrop-filter: blur(10px);
      animation: floatContainer 4s ease-in-out infinite;
      margin: auto;
    }

    @keyframes floatContainer {
      0% { 
        transform: translateY(0px); 
        box-shadow: 0 0 15px var(--neon-red-glow), inset 0 0 15px rgba(10, 14, 41, 0.8); 
      }
      50% { 
        transform: translateY(-12px); 
        box-shadow: 0 15px 30px var(--neon-red), inset 0 0 25px rgba(255, 0, 60, 0.2); 
      }
      100% { 
        transform: translateY(0px); 
        box-shadow: 0 0 15px var(--neon-red-glow), inset 0 0 15px rgba(10, 14, 41, 0.8); 
      }
    }

    .share-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: transparent;
      border: 1px solid var(--neon-red);
      color: var(--neon-red);
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: 0.3s;
      z-index: 10;
      box-shadow: 0 0 5px var(--neon-red-glow);
    }

    .share-btn:hover {
      background: var(--neon-red);
      color: var(--navy-dark);
      box-shadow: 0 0 15px var(--neon-red);
      transform: scale(1.1);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      background: transparent;
      border: 2px solid var(--neon-red);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      color: var(--neon-red);
      animation: rotateGlow 3s linear infinite;
      text-decoration: none;
      cursor: pointer;
    }

    @keyframes rotateGlow {
      0% { box-shadow: 0 0 10px var(--neon-red); transform: rotate(0deg) scale(1); }
      50% { box-shadow: 0 0 30px var(--neon-red), inset 0 0 15px var(--neon-red); transform: rotate(180deg) scale(1.05); }
      100% { box-shadow: 0 0 10px var(--neon-red); transform: rotate(360deg) scale(1); }
    }

    .logo i {
      animation: counterRotate 3s linear infinite;
    }

    @keyframes counterRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 26px;
      font-weight: 900;
      margin-bottom: 5px;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 2px;
      animation: neonFlicker 2s infinite alternate;
    }

    @keyframes neonFlicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
        text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px var(--neon-red), 0 0 40px var(--neon-red);
      }
      20%, 24%, 55% {
        text-shadow: none;
      }
    }

    .subtitle {
      font-size: 14px;
      font-weight: bold;
      color: var(--neon-red);
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      animation: pulseText 2s ease-in-out infinite;
    }

    @keyframes pulseText {
      0%, 100% { opacity: 1; text-shadow: 0 0 5px var(--neon-red-glow); }
      50% { opacity: 0.6; text-shadow: none; }
    }

    .input-group {
      margin-bottom: 25px;
    }

    .input-label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      color: var(--neon-red);
      letter-spacing: 1px;
    }

    .url-wrapper {
      display: flex;
      gap: 0;
      align-items: stretch;
    }

    .input-field {
      flex: 1;
      padding: 15px;
      background: rgba(255, 0, 60, 0.05);
      border: 1px solid rgba(255, 0, 60, 0.3);
      border-bottom: 3px solid var(--neon-red);
      color: #fff;
      font-family: 'Share Tech Mono', monospace;
      font-weight: bold;
      font-size: 16px;
      transition: 0.3s;
      outline: none;
      border-radius: 0;
    }

    .input-field:focus {
      border-color: var(--neon-red);
      box-shadow: 0 10px 20px -10px var(--neon-red), inset 0 0 10px var(--neon-red-dim);
      background: rgba(255, 0, 60, 0.1);
    }

    .paste-btn {
      background: rgba(255, 0, 60, 0.2);
      border: 1px solid var(--neon-red);
      border-left: none;
      border-bottom: 3px solid var(--neon-red);
      color: var(--neon-red);
      padding: 0 18px;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }

    .paste-btn:hover {
      background: var(--neon-red);
      color: var(--navy-dark);
      box-shadow: 0 0 10px var(--neon-red);
    }

    .download-btn {
      display: block;
      width: auto;
      margin: 0 auto 20px auto;
      padding: 8px 24px;
      background: transparent;
      border: 2px solid var(--neon-red);
      color: var(--neon-red);
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
      text-shadow: 0 0 5px var(--neon-red);
    }

    .download-btn:hover {
      background: var(--neon-red);
      color: var(--navy-dark);
      box-shadow: 0 0 25px var(--neon-red);
      text-shadow: none;
      transform: translateY(-2px);
    }

    .download-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: 0.5s;
    }

    .download-btn:hover::before {
      left: 100%;
    }

    .error-msg {
      color: var(--neon-red);
      text-align: center;
      margin: 10px 0;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .loader {
      display: flex;
      justify-content: center;
      margin: 15px 0;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--neon-red-dim);
      border-top: 3px solid var(--neon-red);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .code-display {
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid var(--neon-red);
      padding: 20px;
      margin-bottom: 20px;
      min-height: 80px;
      display: none;
      flex-direction: column;
      gap: 15px;
      animation: pulseBorder 2s infinite alternate;
    }

    .code-display.active {
      display: flex;
    }

    @keyframes pulseBorder {
      0% { border-color: var(--neon-red-dim); }
      100% { border-color: var(--neon-red); }
    }

    .media-card {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--neon-red);
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .media-card h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      color: var(--neon-red);
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    video {
      width: 100%;
      border-radius: 4px;
      border: 1px solid var(--neon-red-dim);
      margin-top: 8px;
    }

    .download-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
    }

    .dl-link {
      background: transparent;
      border: 1px solid var(--neon-red);
      color: var(--neon-red);
      padding: 8px 16px;
      font-family: 'Share Tech Mono', monospace;
      font-weight: bold;
      text-decoration: none;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: 0.2s;
      display: inline-block;
    }

    .dl-link:hover {
      background: var(--neon-red);
      color: var(--navy-dark);
      box-shadow: 0 0 12px var(--neon-red);
      transform: translateY(-2px);
    }

    .quality-badge {
      font-size: 10px;
      background: rgba(255,0,60,0.2);
      padding: 2px 6px;
      border-radius: 20px;
      margin-right: 6px;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      font-size: 11px;
      font-weight: bold;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 2px;
      border-top: 2px dashed var(--neon-red-dim);
      padding-top: 15px;
    }

    @media (max-width: 550px) {
      body { padding: 20px 10px; }
      .container { padding: 25px; }
      .title { font-size: 22px; }
      .logo { width: 55px; height: 55px; font-size: 24px; }
      .download-btn { font-size: 11px; padding: 6px 18px; }
      .paste-btn { padding: 0 12px; font-size: 10px; }
      .share-btn { width: 30px; height: 30px; font-size: 12px; top: 10px; right: 10px; }
    }
  </style>
</head>
<body>

<div class="container">
  <button class="share-btn" id="shareBtn" title="Share this tool">
    <i class="fas fa-share-nodes"></i>
  </button>

  <div class="header">
    <div class="logo">
      <i class="fas fa-download"></i>
    </div>
    <h1 class="title">PROxABDULLAH</h1>
    <p class="subtitle">NEO DOWNLOADER // v3.0</p>
  </div>

  <div class="input-group">
    <label class="input-label">> VIDEO_URL</label>
    <div class="url-wrapper">
      <input type="text" id="urlInput" class="input-field" placeholder="https://youtube.com/... | tiktok | instagram" />
      <button class="paste-btn" id="pasteBtn"><i class="fas fa-paste"></i> PASTE</button>
    </div>
  </div>

  <button class="download-btn" id="downloadBtn">
    <i class="fas fa-bolt"></i> DOWNLOAD
  </button>

  <div id="errorDisplay" class="error-msg"></div>
  <div id="loaderZone" class="loader" style="display: none;"></div>
  <div id="resultsContainer" class="code-display"></div>

  <div class="footer">
    <p>PROxABDULLAH // POWERED BY FAA-API</p>
  </div>
</div>

<script>
  const urlInput = document.getElementById('urlInput');
  const pasteBtn = document.getElementById('pasteBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const shareBtn = document.getElementById('shareBtn');
  const errorDiv = document.getElementById('errorDisplay');
  const loaderZone = document.getElementById('loaderZone');
  const resultsContainer = document.getElementById('resultsContainer');

  function setLoading(show) {
    if (show) {
      loaderZone.style.display = 'flex';
      loaderZone.innerHTML = '<div class="spinner"></div>';
    } else {
      loaderZone.style.display = 'none';
      loaderZone.innerHTML = '';
    }
  }

  function setError(msg) {
    errorDiv.innerText = msg || '';
  }

  function isValidUrl(string) {
    try {
      const url = new URL(string);
      return url.protocol === 'http:' || url.protocol === 'https:';
    } catch (_) {
      return false;
    }
  }

  async function pasteFromClipboard() {
    try {
      const text = await navigator.clipboard.readText();
      if (text) {
        urlInput.value = text;
        setError('✓ LINK_PASTED');
        setTimeout(() => setError(''), 1500);
      } else {
        setError('⚠️ CLIPBOARD_EMPTY');
      }
    } catch (e) {
      setError('⚠️ PERMISSION_DENIED');
    }
  }

  async function shareWebsite() {
    const linkToShare = window.location.href;
    try {
      await navigator.clipboard.writeText(linkToShare);
      const originalIcon = shareBtn.innerHTML;
      shareBtn.innerHTML = '<i class="fas fa-check"></i>';
      shareBtn.style.background = 'var(--success-color)';
      shareBtn.style.color = 'var(--navy-dark)';
      shareBtn.style.borderColor = 'var(--success-color)';
      shareBtn.style.boxShadow = '0 0 15px var(--success-color)';
      setTimeout(() => {
        shareBtn.innerHTML = originalIcon;
        shareBtn.style.background = 'transparent';
        shareBtn.style.color = 'var(--neon-red)';
        shareBtn.style.borderColor = 'var(--neon-red)';
        shareBtn.style.boxShadow = '0 0 5px var(--neon-red-glow)';
      }, 2000);
      setError('✓ LINK_COPIED');
      setTimeout(() => setError(''), 2000);
    } catch (err) {
      setError('⚠️ SHARE_FAILED');
    }
  }

  async function fetchMedia() {
    const rawUrl = urlInput.value.trim();
    
    if (!rawUrl) {
      setError('⛔ INPUT_REQUIRED: ENTER VALID URL');
      return;
    }
    
    if (!isValidUrl(rawUrl)) {
      setError('⚠️ INVALID LINK: MUST START WITH HTTP:// OR HTTPS://');
      return;
    }

    setError('');
    resultsContainer.innerHTML = '';
    resultsContainer.classList.remove('active');
    setLoading(true);

    try {
      // New API endpoint
      const apiUrl = `https://api-faa.my.id/faa/aio?url=${encodeURIComponent(rawUrl)}`;
      
      // Use CORS proxy to avoid any possible blocking
      const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(apiUrl)}`;
      
      const response = await fetch(proxyUrl);
      
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      
      const data = await response.json();

      setLoading(false);

      // Check API response structure
      if (!data.status || data.result.error === true) {
        setError('❌ FETCH_FAILED: UNSUPPORTED LINK OR API ERROR');
        return;
      }

      const medias = data.result.medias || [];
      if (medias.length === 0) {
        setError('❌ NO_MEDIA_FOUND');
        return;
      }

      let htmlOutput = '';

      // Find a video for preview (first video in list)
      const previewVideo = medias.find(m => m.type === 'video');
      if (previewVideo && previewVideo.url) {
        htmlOutput += `
          <div class="media-card">
            <h3><i class="fas fa-play-circle"></i> PREVIEW</h3>
            <video controls src="${previewVideo.url}" controlsList="nodownload"></video>
          </div>
        `;
      } else if (data.result.thumbnail) {
        // fallback: show thumbnail if no preview video
        htmlOutput += `
          <div class="media-card">
            <h3><i class="fas fa-image"></i> THUMBNAIL</h3>
            <img src="${data.result.thumbnail}" style="width:100%; border-radius:8px; margin-top:8px;" alt="thumbnail">
          </div>
        `;
      }

      // Separate video and audio formats
      const videoFormats = medias.filter(m => m.type === 'video');
      const audioFormats = medias.filter(m => m.type === 'audio');

      if (videoFormats.length > 0) {
        let videoBlock = `<div class="media-card"><h3><i class="fas fa-video"></i> VIDEO_STREAMS</h3><div class="download-links">`;
        videoFormats.forEach(v => {
          const label = v.label || v.quality || `${v.width}x${v.height}`;
          videoBlock += `
            <a class="dl-link" href="${v.url}" target="_blank" rel="noopener noreferrer">
              <span class="quality-badge">${label}</span> DOWNLOAD
            </a>
          `;
        });
        videoBlock += `</div></div>`;
        htmlOutput += videoBlock;
      }

      if (audioFormats.length > 0) {
        let audioBlock = `<div class="media-card"><h3><i class="fas fa-headphones"></i> AUDIO_MP3</h3><div class="download-links">`;
        audioFormats.forEach(a => {
          const label = a.label || a.quality || `${a.bitrate}bps`;
          audioBlock += `
            <a class="dl-link" href="${a.url}" target="_blank" rel="noopener noreferrer">
              🎧 ${label}
            </a>
          `;
        });
        audioBlock += `</div></div>`;
        htmlOutput += audioBlock;
      }

      resultsContainer.innerHTML = htmlOutput;
      resultsContainer.classList.add('active');

    } catch (err) {
      setLoading(false);
      console.error(err);
      setError('🌐 NETWORK_ERROR: CORS OR API DOWN. TRY AGAIN LATER.');
    }
  }

  pasteBtn.addEventListener('click', pasteFromClipboard);
  downloadBtn.addEventListener('click', fetchMedia);
  shareBtn.addEventListener('click', shareWebsite);
  urlInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') fetchMedia();
  });
</script>
</body>
</html>
